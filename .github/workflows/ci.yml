name: CI/CD Pipeline

on:
  push:
    branches: [main, task-*]
  pull_request:
    branches: [main]

jobs:
  validate-setup:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Check project structure
      run: |
        [ -f "requirements.txt" ] || exit 1
        [ -f "README.md" ] || exit 1
        [ -f ".gitignore" ] || exit 1
        [ -d "notebooks" ] || exit 1
        [ -d "data" ] || exit 1
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test imports
      run: |
        python -c "
        import pandas as pd
        import numpy as np
        import matplotlib
        print('Core packages imported successfully')
        "
    
    - name: Verify notebook
      run: |
        python -c "
        import json
        with open('notebooks/01_eda.ipynb', 'r') as f:
            nb = json.load(f)
        print(f'Notebook contains {len(nb.get(\"cells\", []))} cells')
        "